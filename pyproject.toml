[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glacis-autoredteam"
dynamic = ["version"]
description = "Closed-loop adversarial red-teaming and hardening for AI systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Glacis", email = "eng@glacis.io"},
]
keywords = [
    "ai-safety", "red-teaming", "llm", "security", "alignment",
    "prompt-injection", "jailbreak", "owasp", "mitre-atlas", "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
openai = ["openai>=1.66,<4"]
anthropic = ["anthropic>=0.40,<2"]
google = ["google-genai>=1.0,<3"]
cloud = ["boto3>=1.34,<2.0"]
training = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.28",
    "datasets>=2.18",
]
all = [
    "glacis-autoredteam[openai]",
    "glacis-autoredteam[anthropic]",
    "glacis-autoredteam[google]",
    "glacis-autoredteam[cloud]",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
autoredteam = "autoredteam.cli:main"

[project.urls]
Homepage = "https://github.com/glacis-io/auto-redteam"
Documentation = "https://github.com/glacis-io/auto-redteam#readme"
Repository = "https://github.com/glacis-io/auto-redteam"
Issues = "https://github.com/glacis-io/auto-redteam/issues"
Changelog = "https://github.com/glacis-io/auto-redteam/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "autoredteam.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["autoredteam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F821", "B006", "B008", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]
"src/autoredteam/**/__init__.py" = ["F401"]
